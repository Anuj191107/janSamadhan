<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jan Samadhan - Citizen</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="app-page citizen-page">

    <header class="app-header">
        <a class="app-brand" href="citizen.html"><span class="brand-mark">JS</span><strong>Jan Samadhan</strong></a>

        <nav>

            <a href="citizen.html">
                Home
            </a>

            <a href="report.html">
                Report Issue
            </a>

            <a href="profile.html">
                My Profile
            </a>

            <button id="logoutButton" type="button">Logout</button>

        </nav>

    </header>


    <main>

        <h2>Civic Issues</h2>


        <!-- Category filters -->

        <div id="filters">

            <button data-category="all">
                All
            </button>

            <button data-category="Road">
                Road
            </button>

            <button data-category="Water">
                Water
            </button>

            <button data-category="Garbage">
                Garbage
            </button>

            <button data-category="Drainage">
                Drainage
            </button>

            <button data-category="Street Light">
                Street Light
            </button>

        </div>


        <!-- Loading message -->

        <p id="loadingMessage">
            Loading complaints...
        </p>


        <!-- Error message -->

        <p id="errorMessage"></p>


        <!-- Complaints will appear here -->

        <div id="complaintsContainer"></div>


    </main>


    <script type="module" src="js/complaints.js">
    </script>

    <script type="module" src="js/logout.js">
    </script>

<script type="module" src="js/phase5-actions.js"></script>
</body>

</html>
