<!DOCTYPE html>
<html>

<head>
    <title>Register - Jan Samadhan</title>
</head>

<body>

    <h1>Create Account</h1>

    <input
        type="text"
        id="name"
        placeholder="Full Name"
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <select id="role">

        <option value="citizen">
            Citizen
        </option>

        <option value="government">
            Government
        </option>

    </select>

    <button id="registerButton">
        Register
    </button>

    <p id="message"></p>


    <script
        type="module"
        src="js/auth.js">
    </script>

</body>

</html>
