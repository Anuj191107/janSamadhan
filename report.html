<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176b4b">
    <title>Report Issue - Jan Samadhan</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-page report-page">
  <header class="app-header"><a class="app-brand" href="citizen.html"><span class="brand-mark">JS</span><strong>Jan Samadhan</strong></a><nav><a href="citizen.html">Civic Issues</a><a href="profile.html">My Profile</a><button id="logoutButton" type="button">Logout</button></nav></header>
  <main class="form-main">
    <a class="back-link" href="citizen.html">← Back to Civic Issues</a>
    <section class="form-panel">
      <p class="eyebrow">COMMUNITY REPORTING</p>
      <h1>Report a civic issue</h1>
      <p class="muted-copy">Describe what needs attention and include helpful photo and location details.</p>

    <form id="complaintForm">

        <label>Issue Title</label>
        <br>

        <input type="text" id="title" required>

        <br><br>


        <label>Category</label>
        <br>

        <select id="category" required>

            <option value="">
                Select Category
            </option>

            <option value="Road">
                Road
            </option>

            <option value="Garbage">
                Garbage
            </option>

            <option value="Water">
                Water
            </option>

            <option value="Drainage">
                Drainage
            </option>

            <option value="Street Light">
                Street Light
            </option>

            <option value="Electricity">
                Electricity
            </option>

            <option value="Other">
                Other
            </option>

        </select>

        <br><br>


        <label>Description</label>
        <br>

        <textarea id="description" rows="5" required></textarea>

        <br><br>


        <label>Complaint Image</label>
        <br>

        <input type="file" id="image" accept="image/*" required>

        <br><br>


        <button type="button" id="locationButton">
            📍 Use My Location
        </button>

        <p id="locationStatus">
            Location not selected
        </p>


        <button type="submit" id="submitButton">
            Submit Complaint
        </button>

    </form>


    <p id="message" role="status" aria-live="polite"></p>
    </section>
  </main>

    <script type="module" src="js/report.js">
    </script>

</body>

</html>
